name: CI

# Gates for the substrate-kernels build (testing/strategy.md). Each gate is its own
# attributable job, and every job builds flake outputs — the same derivations a laptop
# builds — so CI and a developer machine can never run different pipelines (ADR 0017).
#
# Every job authenticates to the org binary cache with its GitHub OIDC token through the
# cachet-setup action, which also pushes what the job built when it succeeds. That push is
# what makes a teammate's `just build` a download rather than a forty-minute compile: the
# store paths CI builds here are the store paths every machine computes from the same
# commit. CI covers x86_64 + aarch64 (substrate's hosts); riscv64 and the windows variant
# are carried but not CI-gated (ADR 0002).

on:
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

# id-token lets each job mint the OIDC token cachet accepts for writes; there is no stored
# cache credential anywhere in this repository (cachet's docs/contracts.md).
permissions:
  contents: read
  id-token: write

jobs:
  # ---- every fast gate, per build system -----------------------------------------
  # `nix flake check` builds the system's whole gate set: doc-manifest, bundle-golden,
  # pack-unit, applies-clean for both lines, and each configured gate whose cell builds on
  # this system (olddefconfig + config-invariant, no compile).
  gates:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { rarch: amd64 }
          - { rarch: arm64 }
    runs-on: nscloud-ubuntu-24.04-${{ matrix.rarch }}-8x16
    steps:
      - uses: actions/checkout@v6
        # This job only validates, so it wires the cache in read-only and never signs or pushes;
        # the build job is what populates the cache. push: false is why an empty signing key here
        # is harmless.
      - uses: agx-runtime/cachet-action@v1
        with:
          signing-key: ${{ secrets.CACHET_SIGNING_KEY }}
          push: 'false'
      - name: Run every gate for this system
        run: nix flake check --print-build-logs

  # ---- full build → the .kernel bundle -------------------------------------------
  # One job per CI-gated cell, natively on the cell's own architecture. The cachet-setup
  # post step pushes the built closure to the cache and, on main, renews the cell's
  # garbage-collection lease — each cell has its own lease because a lease is replaced
  # wholesale on renewal, so eight parallel jobs sharing one lease would each erase the
  # other seven cells' protection.
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { kernel_line: "6.12", line_attr: "6_12", garch: x86_64, rarch: amd64, variant: base }
          - { kernel_line: "6.12", line_attr: "6_12", garch: x86_64, rarch: amd64, variant: debug }
          - { kernel_line: "6.12", line_attr: "6_12", garch: aarch64, rarch: arm64, variant: base }
          - { kernel_line: "6.12", line_attr: "6_12", garch: aarch64, rarch: arm64, variant: debug }
          - { kernel_line: "6.18", line_attr: "6_18", garch: x86_64, rarch: amd64, variant: base }
          - { kernel_line: "6.18", line_attr: "6_18", garch: x86_64, rarch: amd64, variant: debug }
          - { kernel_line: "6.18", line_attr: "6_18", garch: aarch64, rarch: arm64, variant: base }
          - { kernel_line: "6.18", line_attr: "6_18", garch: aarch64, rarch: arm64, variant: debug }
    runs-on: nscloud-ubuntu-24.04-${{ matrix.rarch }}-8x16
    steps:
      - uses: actions/checkout@v6
      - uses: agx-runtime/cachet-action@v1
        with:
          roots: .#kernel-${{ matrix.line_attr }}-${{ matrix.variant }}-${{ matrix.garch }}
          project: agx-runtime-substrate-kernels-${{ matrix.kernel_line }}-${{ matrix.variant }}-${{ matrix.garch }}
          signing-key: ${{ secrets.CACHET_SIGNING_KEY }}
      # TEMPORARY diagnostic: the daemon is not substituting from cachet even though cachet holds
      # the paths, and how the netrc reaches the daemon on this runner is not known. This dumps the
      # daemon's effective config and tests cachet auth directly, so the fix rests on facts rather
      # than another guess. Remove once the pull works.
      - name: debug cachet auth (temporary)
        if: matrix.line_attr == '6_12' && matrix.garch == 'x86_64' && matrix.variant == 'base'
        run: |
          set +e
          echo "=== systemd present / nix-daemon a service? ==="; command -v systemctl && systemctl is-active nix-daemon; echo "rc=$?"
          echo "=== daemon process ==="; ps aux | grep -iE 'nix-daemon|determinate-nixd' | grep -v grep
          echo "=== netrc-file the daemon reads ==="; nf=$(nix config show netrc-file); echo "$nf"
          echo "=== substituters / extra-substituters ==="; nix config show substituters; nix config show extra-substituters
          echo "=== trusted-public-keys has cachet? ==="; nix config show trusted-public-keys | tr ' ' '\n' | grep pkg-cache || echo "NO cachet key trusted"
          echo "=== /etc/determinate/config.json ==="; sudo cat /etc/determinate/config.json 2>&1
          echo "=== does the synthesized netrc carry the cachet cred? ==="; sudo grep -c pkg-cache "$nf" 2>&1; echo "(reading $nf)"
          echo "=== our /etc/nix/netrc ==="; sudo grep -c pkg-cache /etc/nix/netrc 2>&1
          echo "=== direct substituter auth test against cachet ==="
          nix path-info --store https://pkg-cache.loopholelabs.io /nix/store/h5yfvnkqv0zpij89l4pwviljy6aqwwsq-kernel-bundle-base-x86_64-6.12.96 2>&1 | head -4
          echo "=== determinate-nixd subcommands ==="; determinate-nixd --help 2>&1 | head -45
          true
      - name: Build the bundle cell
        run: nix build --print-build-logs '.#kernel-${{ matrix.line_attr }}-${{ matrix.variant }}-${{ matrix.garch }}'
      - name: Stage the bundle and the raw kernel binary for the boot-smoke lane
        run: cp -L result/linux-*.kernel result/kernel-binary .
      - uses: actions/upload-artifact@v7
        with:
          name: bundle-${{ matrix.kernel_line }}-${{ matrix.variant }}-${{ matrix.garch }}
          path: |
            linux-*-${{ matrix.variant }}-${{ matrix.garch }}.kernel
            kernel-binary
          if-no-files-found: error

  # ---- interim QEMU boot (testing/boot-smoke.md) ---------------------------------
  # Real boot-smoke (under substrate) is the cross-repo lane (ADR 0004 §4); this boots the
  # produced kernel under QEMU — at both 512 MiB and 2048 MiB — and checks for the kernel
  # banner. QEMU's own -kernel loader places the Image, so the bundle's load_addr is locked
  # by bundle-golden, not exercised here. QEMU comes from apt because it is harness tooling
  # on the runner, never an input to the artifact.
  boot-smoke:
    needs: build
    strategy:
      fail-fast: false
      matrix:
        include:
          - { kernel_line: "6.12", garch: x86_64, rarch: amd64, variant: base }
          - { kernel_line: "6.12", garch: x86_64, rarch: amd64, variant: debug }
          - { kernel_line: "6.12", garch: aarch64, rarch: arm64, variant: base }
          - { kernel_line: "6.12", garch: aarch64, rarch: arm64, variant: debug }
          - { kernel_line: "6.18", garch: x86_64, rarch: amd64, variant: base }
          - { kernel_line: "6.18", garch: x86_64, rarch: amd64, variant: debug }
          - { kernel_line: "6.18", garch: aarch64, rarch: arm64, variant: base }
          - { kernel_line: "6.18", garch: aarch64, rarch: arm64, variant: debug }
    runs-on: nscloud-ubuntu-24.04-${{ matrix.rarch }}-8x16
    steps:
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v8
        with:
          name: bundle-${{ matrix.kernel_line }}-${{ matrix.variant }}-${{ matrix.garch }}
      - name: Install QEMU
        run: sudo apt-get update && sudo apt-get install -y qemu-system-x86 qemu-system-arm
      - name: Boot the kernel under QEMU
        run: bash scripts/boot-smoke.sh --arch ${{ matrix.garch }} --kernel kernel-binary --timeout 240

  # ---- reproducibility: byte-identical rebuild (ADR 0005) -------------------------
  # `nix build` first realizes the cell — usually by substituting what the build lane
  # already pushed — and `nix build --rebuild` then compiles it locally and fails if a
  # single byte differs. On a substituted path this therefore also verifies that the cache
  # serves exactly what this commit's source builds. The double-compile is slow; it runs on
  # main and manual dispatch, and the PR signal comes from the build lane.
  repro-check:
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    strategy:
      fail-fast: false
      matrix:
        include:
          - { line_attr: "6_12", garch: x86_64, rarch: amd64, variant: base }
          - { line_attr: "6_12", garch: x86_64, rarch: amd64, variant: debug }
          - { line_attr: "6_12", garch: aarch64, rarch: arm64, variant: base }
          - { line_attr: "6_12", garch: aarch64, rarch: arm64, variant: debug }
          - { line_attr: "6_18", garch: x86_64, rarch: amd64, variant: base }
          - { line_attr: "6_18", garch: x86_64, rarch: amd64, variant: debug }
          - { line_attr: "6_18", garch: aarch64, rarch: arm64, variant: base }
          - { line_attr: "6_18", garch: aarch64, rarch: arm64, variant: debug }
    runs-on: nscloud-ubuntu-24.04-${{ matrix.rarch }}-8x16
    steps:
      - uses: actions/checkout@v6
      # Read-only: the rebuilt paths are byte-identical to what the build lane already
      # pushed, so pushing them again would only spend upload time.
      - uses: agx-runtime/cachet-action@v1
        with:
          push: "false"
          signing-key: ${{ secrets.CACHET_SIGNING_KEY }}
      - name: Assert a byte-identical rebuild
        run: |
          nix build '.#kernel-${{ matrix.line_attr }}-${{ matrix.variant }}-${{ matrix.garch }}'
          nix build --rebuild --print-build-logs '.#kernel-${{ matrix.line_attr }}-${{ matrix.variant }}-${{ matrix.garch }}'
